function invoiceDocument(i){let groups=new Map();i.items.forEach(x=>{let key=x.service+'|'+x.price,g=groups.get(key);if(!g){g={service:x.service,price:x.price,qty:0,patients:[]};groups.set(key,g)}g.qty+=Number(x.qty);g.patients.push(x.patient+' · '+x.os+' · '+x.qty+' un.')});let total=invoiceTotal(i),paid=invoicePaid(i),c=client(i.clientId);return `<div class="doc-sheet">${docHeader()}<div class="doc-title">FATURA</div><div class="doc-meta"><b>Nº da Fatura ${esc(i.number)}</b> · Competência ${esc(i.competence)}</div><div class="doc-cols"><div><div class="doc-label">Emissão</div>${fmt(i.date)}<div class="doc-label">Vencimento</div>${fmt(i.due)}<div class="doc-label">Emitente</div>${esc(db.settings.company)}<br>${esc(db.settings.address||'')}<br>${esc(db.settings.email||'')}</div><div><div class="doc-label">Faturar para</div><b>${esc(c?.name||'—')}</b><br>${esc(c?.address||'')}<br>${esc(c?.taxid||'')}</div></div><table class="doc-table"><thead><tr><th>Nº</th><th>Item & descrição / pacientes</th><th>Quant.</th><th>Taxa</th><th>Montante</th></tr></thead><tbody>${[...groups.values()].map((g,k)=>`<tr><td>${k+1}</td><td><b>${esc(g.service)}</b><div class="smalltext" style="white-space:pre-line">${g.patients.map(esc).join('<br>')}</div></td><td>${g.qty}</td><td>${money(g.price)}</td><td>${money(g.qty*g.price)}</td></tr>`).join('')}</tbody></table><div class="doc-total">Subtotal: ${money(total)}<br>Total: ${money(total)}<br>Pagamento efetuado: ${money(paid)}<br>Saldo devido: ${money(Math.max(0,total-paid))}</div><div class="doc-foot">Termos & condições: vencimento em ${fmt(i.due)}. Dados para pagamento: ${esc(db.settings.paymentInfo||'Configure os dados de pagamento em Configurações.')}</div></div>`}
function registerInvoicePayment(id){let i=db.invoices.find(x=>x.id===id);if(!i)return;let remaining=Math.max(0,invoiceTotal(i)-invoicePaid(i));if(!remaining)return alert('Esta fatura já está quitada.');let x=prompt('Valor recebido (R$). Saldo atual: '+money(remaining),remaining.toFixed(2).replace('.',','));if(x===null)return;let amount=Number(x.replace(/\./g,'').replace(',','.'));if(!Number.isFinite(amount)||amount<=0||amount>remaining+.001)return alert('Informe um valor positivo até o saldo devido.');i.payments.push({amount,date:today()});save();render()}
function render(){let content=view==='dashboard'?dashboard():view==='agenda'?agenda():view==='searchall'?globalSearch():view==='invoices'?invoices():view==='prosthesis'||view==='plates'?production():view==='outsourcing'?outsourcing():view==='clients'?clients():view==='receipts'?receipts():view==='billing'?billing():view==='settings'?settings():backup();$('#app').innerHTML=`<div class="app"><button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Recolher menu lateral" title="Recolher ou mostrar menu lateral">☰</button>${sidebar()}<main class="main">${content}</main></div>${modal?(modal==='outsource'?outsourceModal():modalHTML()):''}`;bind()}
function teethHTML(){let rows=[[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38]];return rows.map((r,i)=>`<div class="smalltext" style="margin-top:7px">${i?'Arcada inferior':'Arcada superior'}</div><div class="teeth">${r.map(n=>`<button type="button" class="tooth ${selectedTeeth.includes(n)?'selected':''}" data-tooth="${n}">${n}</button>`).join('')}</div>`).join('')}
function modalHTML(){if(modal==='job'){let j=editing||{kind,clientId:'dentista',typeId:kind==='plates'?(db.types.find(x=>isPlate(x))?.id||'bruxismo'):(db.types.find(x=>!isPlate(x))?.id||'dente'),patient:'',qty:1,received:today(),due:'',stage:db.stages[kind][0],teeth:[],model:false,notes:'',implant:'',tiBase:'',price:undefined,cost:undefined,commission:undefined};let t=type(j.typeId),c=client(j.clientId);let qty=j.kind==='plates'?j.qty:(selectedTeeth.length||j.qty);return `<div class="modalback"><div class="modal"><div class="modalhead"><h2>${editing?'Editar':'Novo'} trabalho · ${j.kind==='plates'?'Placas':'Próteses'}</h2><button class="btn secondary small" data-close>Fechar ×</button></div><form id="jobform"><div class="modalbody"><div class="formgrid"><label>Nome do paciente<input name="patient" required value="${esc(j.patient)}"></label><label>Cliente / clínica<select name="clientId" id="jobclient">${db.clients.map(x=>`<option value="${x.id}" ${x.id===j.clientId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Tipo de trabalho<select name="typeId" id="jobtype">${db.types.filter(x=>isPlate(x)===(j.kind==='plates')).map(x=>`<option value="${x.id}" ${x.id===j.typeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Material (sugerido automaticamente)<input id="jobmaterial" readonly value="${esc(j.kind==='plates'?'Acetato':(t?.material||''))}"></label><label>Recebimento<input name="received" type="date" required value="${j.received}"></label><label>Prazo de entrega<input name="due" type="date" value="${j.due||addDays(j.received,db.settings.deadline)}"></label><label>Etapa<select name="stage">${db.stages[j.kind].filter(s=>s!=='Prova / Try-in'||isProtocol(j)).map(s=>`<option ${s===j.stage?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>Quantidade<input id="jobqty" name="qty" type="number" min="1" max="99" required value="${qty}" ${j.kind==='prosthesis'&&selectedTeeth.length?'readonly':''}></label>${j.kind==='prosthesis'?`<div class="wide"><b style="font-size:12px">Odontograma — selecione os dentes</b><div class="smalltext">A quantidade é preenchida automaticamente quando dentes são selecionados.</div>${teethHTML()}</div><label>Cor do dente (VITA Clássica)<select name="shade"><option value="">Não informada</option>${['A1','A2','A3','A3.5','A4','B1','B2','B3','B4','C1','C2','C3','C4','D2','D3','D4'].map(v=>`<option value="${v}" ${String(j.shade||j.legacyShadeName||'').toUpperCase()===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Modelo necessário?<select name="model"><option value="no" ${!j.model?'selected':''}>Não</option><option value="yes" ${j.model?'selected':''}>Sim</option></select></label><label>Implante / sistema / scanbody<input name="implant" value="${esc(j.implant||'')}"></label><label>Ti-Base / cinta / conexão<input name="tiBase" value="${esc(j.tiBase||'')}"></label>`:''}<label>Valor do serviço por unidade (R$)<input name="price" id="jobprice" type="number" min="0" step="0.01" value="${j.price??(c?.billable?t?.price:0)??0}"></label><label>Custo por unidade (R$)<input name="cost" id="jobcost" type="number" min="0" step="0.01" value="${j.cost??t?.cost??0}"></label><label>Comissão por unidade (R$)<input name="commission" id="jobcommission" type="number" min="0" step="0.01" value="${j.commission??t?.commission??0}"></label><div class="wide note" id="jobtotals">Total do serviço: ${money((j.price??(c?.billable?t?.price:0)??0)*qty)} · Custo: ${money((j.cost??t?.cost??0)*qty)} · Comissão: ${money((j.commission??t?.commission??0)*qty)}</div><label>Fabricante / lote do material<input name="materialLot" value="${esc(j.materialLot||'')}"></label><label>Link de arquivos da OS<input name="filesLink" type="url" value="${esc(j.filesLink||'')}" placeholder="https://..."></label><label>Retrabalho?<select name="rework"><option value="no" ${!j.rework?'selected':''}>Não</option><option value="yes" ${j.rework?'selected':''}>Sim</option></select></label><label>Motivo do retrabalho<input name="reworkReason" value="${esc(j.reworkReason||'')}"></label><label class="wide">Observações / informações da OS<textarea name="notes">${esc(j.notes||'')}</textarea></label></div></div><div class="foot">${editing?'<button type="button" class="btn danger" data-deletejob>Excluir</button>':''}<button type="button" class="btn secondary" data-close>Cancelar</button><button type="submit" class="btn">Salvar trabalho</button></div></form></div></div>`}
if(modal==='client'){let c=editing||{name:'',category:'externo',billable:true};return `<div class="modalback"><div class="modal"><div class="modalhead"><h2>${editing?'Editar':'Novo'} cliente</h2><button class="btn secondary small" data-close>×</button></div><form id="clientform"><div class="modalbody formgrid"><label>Nome do cliente<input name="name" required value="${esc(c.name)}"></label><label>Categoria<select name="category">${[['interna','Clínica interna'],['clinica','Clínica'],['externo','Cliente externo']].map(([v,s])=>`<option value="${v}" ${c.category===v?'selected':''}>${s}</option>`).join('')}</select></label><label>Endereço<input name="address" value="${esc(c.address||'')}" placeholder="Rua, número, cidade / UF"></label><label>E-mail<input name="email" type="email" value="${esc(c.email||'')}"></label><label>Telefone<input name="phone" value="${esc(c.phone||'')}"></label><label>CPF / CNPJ (opcional)<input name="taxid" value="${esc(c.taxid||'')}"></label><label>Gerar faturamento de serviço?<select name="billable"><option value="yes" ${c.billable?'selected':''}>Sim</option><option value="no" ${!c.billable?'selected':''}>Não</option></select></label></div><div class="foot"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn" type="submit">Salvar cliente</button></div></form></div></div>`}
if(modal==='type'){let t=editing||{name:'',material:'Zircônia',price:0,cost:0,commission:15,color:'#6c9cc2',unit:'elemento'};return `<div class="modalback"><div class="modal"><div class="modalhead"><h2>${editing?'Editar':'Novo'} tipo de trabalho</h2><button class="btn secondary small" data-close>×</button></div><form id="typeform"><div class="modalbody formgrid"><label>Nome<input name="name" required value="${esc(t.name)}"></label><label>Material<input name="material" required value="${esc(t.material)}"></label><label>Valor do serviço por unidade (R$)<input name="price" type="number" min="0" step="0.01" value="${t.price}"></label><label>Custo por unidade (R$)<input name="cost" type="number" min="0" step="0.01" value="${t.cost}"></label><label>Comissão por unidade (R$)<input name="commission" type="number" min="0" step="0.01" value="${t.commission}"></label><label>Cor do card<input name="color" type="color" value="${t.color}"></label><label>Unidade<select name="unit"><option value="elemento" ${t.unit==='elemento'?'selected':''}>Elemento</option><option value="placa" ${t.unit==='placa'?'selected':''}>Placa</option></select></label></div><div class="foot"><button type="button" class="btn secondary" data-close>Cancelar</button><button type="submit" class="btn">Salvar tipo</button></div></form></div></div>`}
if(modal==='receipt'){let j=db.jobs.find(x=>x.id===currentReceipt),c=client(j.clientId),r=db.receipts.find(x=>x.jobId===j.id&&(x.receiptType||'final')===currentReceiptType);return `<div class="modalback"><div class="modal"><div class="modalhead"><h2>Recibo de ${currentReceiptType==='proof'?'prova / try-in':'entrega final'}</h2><div class="actions"><button class="btn small secondary" data-close>Fechar</button><button class="btn small" data-printreceipt>Salvar PDF / Imprimir</button></div></div><div class="modalbody"><div class="doc-sheet" id="receiptprint"><div class="doc-head"><div><div class="doc-kicker">Laboratório odontológico</div><div class="doc-brand">${esc(db.settings.company)}</div><div class="doc-meta">${esc(db.settings.address||'Endereço configurável em Configurações')}<br>${esc(db.settings.email||'')} ${esc(db.settings.phone||'')}</div></div><img src="${NELAB_LOGO}" alt="Logo NeLab"></div><div class="doc-title">${currentReceiptType==='proof'?'Recibo de saída para prova':'Recibo de entrega'}</div><div class="doc-meta">Documento ${esc(j.id.slice(0,8).toUpperCase())} · ${fmt(currentReceiptType==='final'?(j.delivered||today()):today())}</div><div class="doc-cols"><div><div class="doc-label">Laboratório emissor</div><b>${esc(db.settings.company)}</b><div class="doc-meta">${esc(db.settings.address||'')}<br>${esc(db.settings.cnpj||'')}</div></div><div><div class="doc-label">Destinatário</div><b>${esc(c?.name||'—')}</b><div class="doc-meta">${esc(c?.address||'')}<br>${esc(c?.email||'')} ${esc(c?.phone||'')}</div></div></div><div class="doc-label">Paciente</div><b>${esc(j.patient)}</b><table class="doc-table"><thead><tr><th>Descrição do trabalho</th><th>Dentes</th><th>Quantidade</th></tr></thead><tbody><tr><td>${esc(type(j.typeId)?.name||'—')}</td><td>${esc((j.teeth||[]).join(', ')||'—')}</td><td>${j.qty}</td></tr></tbody></table>${currentReceiptType==='proof'?'<p class="doc-meta" style="margin-top:22px">Entrega intermediária para prova clínica (try-in). O trabalho permanece em produção e deverá retornar ao laboratório.</p>':''}<div class="signature"><div>Responsável pela entrega</div><div>Responsável pelo recebimento</div></div><div class="doc-foot">${esc(db.settings.company)} · Documento de controle de entrega laboratorial</div></div><div class="no-print" style="margin-top:18px"><b>Anexar foto do recibo assinado</b><p class="smalltext">Fotos são guardadas no navegador. Prefira arquivos pequenos e faça backup; armazenamento local é limitado.</p><input id="receiptfile" type="file" accept="image/*">${r?.image?`<div><img class="imageproof" src="${r.image}" alt="Recibo assinado"><br><button class="btn small danger" data-removereipt>Remover foto</button></div>`:''}</div></div></div></div>`}return ''}

function setupKanbanScrollControls(){
 document.querySelectorAll('.kanban-bottom-scroll').forEach(el=>el.remove());
 const board=document.querySelector('.kanban.kanban-focus');if(!board)return;
 const controls=document.createElement('div');controls.className='kanban-scroll-controls';
 controls.innerHTML='<span>Deslize pelas etapas</span><button type="button" aria-label="Rolar Kanban para esquerda">←</button><button type="button" aria-label="Rolar Kanban para direita">→</button>';
 board.parentNode.insertBefore(controls,board);
 // A barra é fixa na base da tela, mesmo quando as colunas têm muitos cartões.
 const fixed=document.createElement('div');fixed.className='kanban-bottom-scroll';
 fixed.setAttribute('role','region');fixed.setAttribute('aria-label','Rolagem horizontal das etapas do Kanban');
 fixed.innerHTML='<div class="scroll-viewport" aria-label="Arraste para visualizar outras etapas" tabindex="0"><div class="scroll-spacer"></div></div>';
 document.body.appendChild(fixed);
 const viewport=fixed.querySelector('.scroll-viewport'),spacer=fixed.querySelector('.scroll-spacer');
 let syncing=false;
 const measure=()=>{spacer.style.width=Math.max(board.scrollWidth,viewport.clientWidth+1)+'px';viewport.scrollLeft=board.scrollLeft};
 viewport.addEventListener('scroll',()=>{if(syncing)return;syncing=true;board.scrollLeft=viewport.scrollLeft;syncing=false},{passive:true});
 board.addEventListener('scroll',()=>{if(syncing)return;syncing=true;viewport.scrollLeft=board.scrollLeft;syncing=false},{passive:true});
 requestAnimationFrame(measure);
 window.addEventListener('resize',measure,{passive:true});

 const buttons=controls.querySelectorAll('button');
 buttons[0].onclick=()=>board.scrollBy({left:-520,behavior:'smooth'});
 buttons[1].onclick=()=>board.scrollBy({left:520,behavior:'smooth'});
}
function setupKanbanDrag(){
 const board=document.querySelector('.kanban');if(!board)return;
 let active=null;
 const clear=()=>{if(!active)return;active.ghost?.remove();active.card?.classList.remove('drag-origin');board.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));active=null};
 board.querySelectorAll('[data-drag-job]').forEach(card=>{
  card.addEventListener('pointerdown',e=>{
   if(e.button!==0||e.target.closest('button,input,select,a'))return;
   active={card,id:card.dataset.dragJob,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,pointer:e.pointerId,started:false,ghost:null,target:null};
  });
 });
 const move=e=>{
  if(!active||e.pointerId!==active.pointer)return;
  active.x=e.clientX;active.y=e.clientY;
  if(!active.started){if(Math.hypot(e.clientX-active.startX,e.clientY-active.startY)<9)return;
   active.started=true;active.ghost=active.card.cloneNode(true);active.ghost.classList.add('drag-ghost');active.ghost.removeAttribute('data-edit');document.body.appendChild(active.ghost);active.card.classList.add('drag-origin');
  }
  if(e.cancelable)e.preventDefault();
  active.ghost.style.left=(e.clientX-85)+'px';active.ghost.style.top=(e.clientY-32)+'px';
  board.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
  active.target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-stage]');
  if(active.target&&board.contains(active.target))active.target.classList.add('drop-target');else active.target=null;
  const r=board.getBoundingClientRect();if(e.clientX>r.right-35)board.scrollLeft+=15;else if(e.clientX<r.left+35)board.scrollLeft-=15;
 };
 const end=e=>{
  if(!active||e.pointerId!==active.pointer)return;
  const a=active,wasDragged=a.started,stage=a.target?.dataset.dropStage;
  clear();if(!wasDragged)return;
  dragSuppressUntil=Date.now()+500;
  if(!stage)return;
  const j=db.jobs.find(j=>j.id===a.id);if(!j||j.stage===stage)return;
  if(stage==='Prova / Try-in'&&!isProtocol(j)){alert('A etapa de prova é exclusiva para protocolos.');return;}
  setJobStage(j,stage);save();render();
 };
 // Register once per board render; listeners on window are removed when gesture ends.
 board.addEventListener('pointerdown',e=>{
  if(!e.target.closest('[data-drag-job]')||e.target.closest('button'))return;
  const onMove=ev=>move(ev),onUp=ev=>{end(ev);cleanup()},onCancel=()=>{clear();cleanup()};
  function cleanup(){window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel)}
  window.addEventListener('pointermove',onMove,{passive:false});window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onCancel);
 });
 // Prevent opening the edit dialog after a completed drag.
 board.addEventListener('click',e=>{if(Date.now()<dragSuppressUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
}
